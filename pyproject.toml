[project]
name = "hamburg-in-zahlen"
version = "0.1.0"
description = "Offene Daten der Stadt Hamburg als Instagram-Kacheln: pro Kachel ein Befund."
readme = "README.md"
authors = [
    { name = "Coco", email = "coco@mindatlas.dev" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.0.1",
    "kagglehub>=0.3.13",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "duckdb>=1.4.1",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core"
